<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PureEditor-Core-Meta</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            /* Prevent body scroll, let editor handle it */
        }

        #editor {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* [关键] 给 CodeMirror 的内部滚动条容器放权并加防御锁 */
        .cm-editor {
            height: 100%;
        }

        .cm-scroller {
            overflow: auto !important;
            overscroll-behavior: none !important;
        }
    </style>
</head>

<body>
    <div id="editor"></div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
